[package]
name = "baffao-core"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
documentation.workspace = true
description = "Core functionality for OAuth 2.0 Backend For Frontend (BFF) and Token-Mediating Backend"
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
# HTTP & Web
reqwest = { workspace = true, features = ["json", "cookies"] }
http = { workspace = true }
cookie = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
serde_urlencoded = { workspace = true }

# Authentication
oauth2 = { workspace = true }
pkce = { workspace = true }
base64 = { workspace = true }
rand = { workspace = true }
getrandom = { workspace = true, optional = true }
jwt = { workspace = true }
jsonwebtoken = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }

# Logging and error handling
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "json", "time"] }
tracing-appender = { version = "0.2" }
tracing-opentelemetry = { version = "0.19", optional = true }

# Metrics and telemetry
prometheus = { version = "0.13", optional = true }
opentelemetry = { version = "0.19", features = ["rt-tokio"], optional = true }
opentelemetry-otlp = { version = "0.12", features = ["tonic", "trace"], optional = true }
opentelemetry_sdk = { version = "0.19", features = ["trace", "rt-tokio"], optional = true }
opentelemetry-stdout = { version = "0.1", optional = true }

# Async runtime
tokio = { workspace = true }
futures = { workspace = true }

# Utilities
url = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
async-trait = { workspace = true }
cidr = "0.2"

# Storage backends
deadpool-postgres = { version = "0.12", optional = true }
tokio-postgres = { version = "0.7", optional = true, features = ["with-uuid-1", "with-chrono-0_4", "with-serde_json-1"] }
deadpool-redis = { version = "0.14", optional = true }
redis = { version = "0.23", optional = true, features = ["tokio-comp", "connection-manager", "json"] }
time = "0.3"

[features]
default = []
wasm = ["dep:getrandom", "getrandom?/js"]
postgres = ["dep:deadpool-postgres", "dep:tokio-postgres"]
redis = ["dep:deadpool-redis", "dep:redis"]
all-storage = ["postgres", "redis"]
telemetry = ["dep:prometheus", "dep:opentelemetry", "dep:opentelemetry-otlp", "dep:opentelemetry_sdk", "dep:opentelemetry-stdout", "dep:tracing-opentelemetry"]
full = ["all-storage", "telemetry"]