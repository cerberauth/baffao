http:
  routers:
    baffao:
      rule: "Host(`auth.example.com`)"
      service: baffao
      entryPoints:
        - websecure
      middlewares:
        - secHeaders
      tls:
        certResolver: letsencrypt
    
  services:
    baffao:
      loadBalancer:
        servers:
          - url: "http://baffao-server:8080"
        healthCheck:
          path: /health
          interval: 10s
          timeout: 3s
        passHostHeader: true
  
  middlewares:
    secHeaders:
      headers:
        frameDeny: true
        sslRedirect: true
        browserXssFilter: true
        contentTypeNosniff: true
        forceSTSHeader: true
        stsIncludeSubdomains: true
        stsPreload: true
        stsSeconds: 31536000
        customFrameOptionsValue: DENY
        customResponseHeaders:
          X-Content-Type-Options: nosniff
          X-Frame-Options: DENY
          X-XSS-Protection: 1; mode=block
          Referrer-Policy: no-referrer-when-downgrade
          Content-Security-Policy: default-src 'self'; img-src 'self' data:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline';